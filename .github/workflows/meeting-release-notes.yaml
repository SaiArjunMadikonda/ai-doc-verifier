name: Meeting release note draft

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      from_ref:
        description: 'Exclusive start (defaults to the previous version tag)'
        required: false
        type: string
      to_ref:
        description: 'Inclusive end (defaults to the selected ref)'
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  draft:
    if: vars.MEETING_DOCS_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: Draft notes for the release manager
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.repository.default_branch }}
          FROM_REF: ${{ inputs.from_ref }}
          TO_REF: ${{ inputs.to_ref || github.sha }}
        shell: bash
        run: |
          opts=()
          if [[ -n "$FROM_REF" ]]; then opts+=(--from-ref "$FROM_REF"); fi
          if git show-ref --verify --quiet refs/remotes/origin/meeting-docs-state; then
            git show refs/remotes/origin/meeting-docs-state:decisions.db > "$RUNNER_TEMP/meeting-decisions.db"
            opts+=(--state "$RUNNER_TEMP/meeting-decisions.db")
          fi
          uv run --no-project --python 3.12 --with pyyaml python src/meeting_release.py \
            --base "$BASE" --to-ref "$TO_REF" "${opts[@]}" --output "$RUNNER_TEMP/meeting-release.md"
          cat "$RUNNER_TEMP/meeting-release.md" >> "$GITHUB_STEP_SUMMARY"
